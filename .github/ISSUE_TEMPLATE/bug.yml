name: Bug report
description: Report a reproducible bug in Prism
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "OS, Node version, branch (e.g. Windows 11 / Node 22 / feat/...)"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `npm run lint`, `npm run typecheck`, and `npm test` (or documented why not)
        - label: This does not expose personal data, tokens, or a real `*.db` dump
