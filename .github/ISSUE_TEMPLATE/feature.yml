name: Feature request
description: Propose an improvement aligned with Prism’s local-first scope
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Smallest useful change
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Employability / product priority
      options:
        - Security / correctness
        - Demo / recruiter visibility
        - Domain scoring / data quality
        - DX / docs
        - Nice-to-have
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Explicitly out of scope
      description: What should we NOT build (auth, microservices, etc.)?
